# docker-compose.yml
version: '3.8'

services:
  app:
    build: .
    container_name: cubespace-app
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cubespace-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: "localhost"
      PMA_USER: "root"
      PMA_PASSWORD: ""
      PMA_ARBITRARY: 1
    restart: unless-stopped
    depends_on:
      - app
