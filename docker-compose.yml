services:
  db:
    image: mysql:8.4
    container_name: cubespace-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cubespace
      MYSQL_USER: cubespace_user
      MYSQL_PASSWORD: cubespace_password
    ports:
      - "3307:3306"
    volumes:
      - cubespace_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: cubespace-app
    environment:
      DB_HOST: cubespace-db
      DB_PORT: 3306
      DB_USER: cubespace_user
      DB_PASS: cubespace_password
      DB_NAME: cubespace
      MAIL_HOST: smtp.hostinger.com
      MAIL_PORT: 465
      MAIL_USERNAME: hafiz@cubespaces.in
      MAIL_PASSWORD: Hafiz@2026$
      MAIL_ENCRYPTION: ssl
      MAIL_FROM: hafiz@cubespaces.in
      MAIL_FROM_NAME: CubeSpace
      ADMIN_EMAIL: hafiz@cubespaces.in
    ports:
      - "80:80"
      - "8082:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cubespace-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: cubespace-db
      PMA_USER: cubespace_user
      PMA_PASSWORD: cubespace_password
      PMA_ARBITRARY: 1
      PMA_HOST_BASE_URL: phpmyadmin/
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started

volumes:
  cubespace_mysql_data:
